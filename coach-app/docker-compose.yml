version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coach-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config:ro
      - ../resources:/app/resources:ro
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    networks:
      - default
      - shared-infra

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coach-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:80'

networks:
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-shared-infra}
